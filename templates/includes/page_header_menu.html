{% comment %}
  Dispatches clicks on the content menu of a temba-page-header - the default page header includes it, and pages that
  render their own header include it themselves.
{% endcomment %}
<script>
  function handleContentMenuSelected(event) {
    dispatchContentMenuItem(event.detail.item, event.detail.event);
  }

  function refreshMenu() {
    var menu = document.querySelector("temba-menu");
    if (menu) {
      menu.refresh();
    }
  }
</script>
