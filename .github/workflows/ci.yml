name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    # explicit least-privilege token: listing the PR's files is all this job does,
    # and it keeps working if the org ever restricts default token permissions
    permissions:
      pull-requests: read
    outputs:
      components: ${{ steps.filter.outputs.components }}
      temba: ${{ steps.filter.outputs.temba }}
    steps:
      # decide which areas a PR touches so we only run the CI that's called for; jobs
      # skipped here still report a check run (conclusion: skipped) which satisfies
      # branch protection, so both jobs can stay required. pushes to main always run
      # everything to keep a complete baseline.
      - name: Detect changed areas
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "components=true" >> "$GITHUB_OUTPUT"
            echo "temba=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fail open: if we can't list the changed files, run everything rather than nothing
          if ! files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "could not list changed files; running everything"
            echo "components=true" >> "$GITHUB_OUTPUT"
            echo "temba=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          echo "$files"
          components=false
          temba=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/ci.yml) components=true; temba=true ;;
              components/*) components=true ;;
              *) temba=true ;;
            esac
          done <<< "$files"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "temba=$temba" >> "$GITHUB_OUTPUT"

  test-components:
    name: Test Components
    needs: changes
    if: needs.changes.outputs.components == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build and test in dev container
        uses: devcontainers/ci@v0.3
        with:
          configFile: components/.github/devcontainer/devcontainer.json
          # the devcontainer's workspaceFolder is already components/
          runCmd: bun install --frozen-lockfile && bun run validate
          push: never
          # screenshot tests render dates so keep the timezone pinned
          env: |
            CI=true
            TZ=UTC

  test-django:
    name: Test Django
    needs: changes
    if: needs.changes.outputs.temba == 'true'
    runs-on: ubuntu-latest
    container:
      image: python:3.14-trixie

    env:
      node-version: '20'
      bun-version: '1.3.14'
      DJANGO_SETTINGS_MODULE: temba.settings_dev

    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:0.8.3-pg15
        env:
          POSTGRES_DB: temba
          POSTGRES_USER: temba
          POSTGRES_PASSWORD: temba
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      s3:
        image: chrislusf/seaweedfs:4.47
        env:
          AWS_ACCESS_KEY_ID: root
          AWS_SECRET_ACCESS_KEY: tembatemba
        ports:
          - 8333:8333
        options: --health-cmd "curl -f http://localhost:8333/status" --health-interval 5s --health-timeout 2s --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Linux packages
        run: |
          apt update
          apt install -y --no-install-recommends libgdal-dev ffmpeg gettext

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.bun-version }}

      - name: Initialize environment
        run: |
          uv venv
          uv sync --frozen
          bun install --frozen-lockfile
          uv run python manage.py compilemessages --ignore='.venv' --ignore='node_modules'
          uv run python manage.py migrate
          uv run python manage.py migrate_dynamo --testing
          uv run python manage.py create_buckets --testing

      - name: Run pre-test checks
        run: |
          # test that everything is well formatted, no missing migrations etc
          uv run python code_check.py --debug
          # check we can collect and compress all static files
          uv run python manage.py collectstatic --noinput --verbosity=0
          uv run python manage.py compress --extension=".html" --settings=temba.settings_compress
          # collectstatic writes .gz/.br siblings for what it collects, but the compressor bundles are written
          # after it, so they need their own pass - without it WhiteNoise serves them uncompressed
          uv run python -m whitenoise.compress sitestatic

      - name: Run tests
        run: uv run coverage run manage.py test --keepdb --noinput --verbosity=2 --parallel 4

      - name: Coverage report
        run: |
          uv run coverage combine
          uv run coverage report -m --fail-under=100
