[project]
name = "temba"
version = "26.3.100"
description = "Hosted service for visually building interactive messaging applications"
authors = [
    {"name" = "Nyaruka", "email" = "code@nyaruka.com"}
]
readme = "README.md"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "psycopg[pool] ~= 3.3.4",
    "django~=6.1.0",
    "django-allauth[mfa]>=65.8.1,<66.0.0",
    "django-compressor ~= 4.6.0",
    "django-countries ~= 9.0.0",
    "django-formtools ~= 2.7.0",
    "django-mptt ~= 0.18.0",
    "django-storages ~= 1.14.6",
    "django-timezone-field ~= 7.2.2",
    "django-valkey>=0.4.1,<0.5.0",
    "djangorestframework ~= 3.18.0",
    "smartmin>=6.2.2,<7.0.0",
    "celery[redis] ~= 5.6.3",
    "celery-redbeat ~= 2.4.2",
    "boto3>=1.42.24,<2.0.0",
    "cryptography~=50.0.0",
    "geojson ~= 3.3.0",
    "markdown ~= 3.10.3",
    "nh3 ~= 0.3.0",
    "python-magic ~= 0.4.27",
    "xlsxlite ~= 1.1.1",
    "colorama ~= 0.4.6",
    "gunicorn>=26.1.0,<27.0.0",
    "iso8601 ~= 2.1.0",
    "iso639-lang ~= 2.6.0",
    "phonenumbers ~= 9.0.7",
    "pycountry ~= 26.2.16",
    "python-dateutil ~= 2.9.0",
    "packaging ~= 26.3",
    "requests-toolbelt ~= 1.0.0",
    "openpyxl ~= 3.1.5",
    "pillow~=12.3.0",
    "google-genai>=2.19.0,<3.0.0",
    "twilio>=9.10.9,<10.0.0",
    "vonage>=4.8.2,<5.0.0",
    "slack-sdk ~= 3.43.0",
    "openai>=3.3.1,<4.0.0",
    "anthropic>=1.0.0,<2.0.0",
    "pgvector>=0.4.2",
    "fido2>=2.0.0,<3.0.0",
    "elasticsearch>=9.0.0,<10.0.0",
    "tzdata>=2025.2",
    "dnspython ~= 2.8.0",
    "whitenoise[brotli]>=6.12.0,<7.0.0",
]

[project.urls]
repository = "https://github.com/nyaruka/temba"


[dependency-groups]
dev = [
    "coverage[toml]>=7.5.4",
    "responses>=0.25.3",
    "ruff>=0.15.6",
    "djlint>=1.34.1",
    "tblib>=3.0",
]

[tool.code_check]
packages = ["temba"]
locale = "locale"
translated = ["es", "fr", "pt_BR"]
migrations = true
ignore = ["env/*", ".venv/*", ".claude/*", "fabfile.py", "media/*", "sitestatic/*", "static/*", "node_modules/*"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLW0602", "PLW0603"]
ignore = ["E741", "E501", "F405"]

[tool.ruff.lint.per-file-ignores]
# tests only ever run single-threaded and set module state per test by design (see temba.tests.mailroom)
"temba/tests/**" = ["PLW0603"]
"**/tests.py" = ["PLW0603"]
"**/tests/**" = ["PLW0603"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["temba"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.djlint]
blank_line_after_tag = "load"
custom_blocks = "render,element,slot"
custom_html = "temba-[a-z-]+"
format_css = true
format_js = true
ignore = "H021,H023"
indent = 2
max_attribute_length = 100
max_line_length = 200

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2
templating = "django"

[tool.coverage.run]
source = ["./temba"]
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.report]
ignore_errors = true
precision = 0
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "pragma: needs cover",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
]
omit = ["**/tests*", "**/tests/*", "*settings*", "**/management/commands/*", "**/testrunner.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
